  <section class="subscribe" id="subscribe">
    <div class="shell subscribe__inner">
      <div class="subscribe__text">
        <h2 class="h2">Новые поступления — раз в неделю</h2>
        <p class="small muted">Пять-семь книг с описанием и ценой. Без спама, отписаться можно в один клик.</p>
      </div>
      <form class="subscribe__form" data-subscribe>
        <input type="email" name="email" placeholder="you@example.com" aria-label="Электронная почта" required>
        <button class="btn btn--primary" type="submit">Подписаться</button>
      </form>
    </div>
  </section>
